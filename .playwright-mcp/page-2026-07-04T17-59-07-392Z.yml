    - generic [ref=e582]: OUR STORY
    - generic [ref=e583]:
      - heading "It started with a bad launch video." [level=2] [ref=e584]
      - generic [ref=e585]:
        - paragraph [ref=e586]: In 2024 we were two founders and a designer trying to announce a product. A week of After Effects later, we had ninety seconds we weren't proud of — and we'd shipped nothing else.
        - paragraph [ref=e587]: "The tools that promised to help all produced the same templated slop you had to fix by hand. So we built the thing we actually wanted: a director you brief in plain words, that picks the footage and music, sets the type, and cuts to the beat — then hands you a file ready to post."
        - paragraph [ref=e588]: Squook is that director. Today it's used by founders, marketers, and creators in 190 countries to make video that looks designed, from a sentence.

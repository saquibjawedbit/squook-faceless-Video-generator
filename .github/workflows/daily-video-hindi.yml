# # The Hindi channel's daily Short. Same pipeline as the English channel
# # (daily-video-run.yml) with lang=hi, which switches the writer/director to
# # write natively in Hindi, the voice to Kokoro's Hindi one, the caption fonts to
# # Devanagari-capable faces, and the state files to automation/*.hi.json.
# #
# # Setup this needs before its first green run:
# #   1. Mint a refresh token against the HINDI channel — run
# #      automation/get_youtube_token.py and pick that channel at the Google
# #      account chooser (the token, not the client id, is what selects it).
# #   2. Add it as the YT_HI_REFRESH_TOKEN repo secret. YT_HI_CLIENT_ID /
# #      YT_HI_CLIENT_SECRET are optional: leave them unset to reuse the same
# #      OAuth app as the English channel, which is the normal case.
# # Until YT_HI_REFRESH_TOKEN exists the run still generates the video and fails
# # only at the upload, so it is safe to merge before the channel is connected.
# name: daily-video-hindi


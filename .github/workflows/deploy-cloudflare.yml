name: Deploy to Cloudflare

# Builds the app image (root Dockerfile) and deploys the Worker + Container in
# cloudflare/. Runs on GitHub's network, which handles the ~900 MB image push.
# Needs repo secret CLOUDFLARE_DEPLOY_TOKEN (Workers Scripts: Edit + Containers: Edit).
on:
  workflow_dispatch:
  push:
    branches: [feat/landing-page-video]
    paths:
      - 'Dockerfile'
      - 'server/**'
      - 'webapp/**'
      - 'renderer/**'
      - '.agents/skills/landing-page-video/**'
      - 'cloudflare/**'

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        working-directory: cloudflare
        run: npm ci
      - name: Deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 67857d99d183f958afc5d4b768a18044
        run: npx wrangler deploy

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;height:100%;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.09);background:#141419;transition:transform .2s, border-color .2s" style-hover="transform:translateY(-4px);border-color:rgba(255,255,255,0.22)">
  <image-slot id="{{ slotId }}" shape="rect" placeholder="Drop a video thumbnail" style="position:absolute;inset:0;width:100%;height:100%"></image-slot>
  <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.25) 32%, transparent 55%)"></div>
  <div style="position:absolute;top:12px;left:12px;pointer-events:none;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,0.85);background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);padding:4px 8px;border-radius:6px">{{ meta }}</div>
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center">
    <span style="display:block;width:0;height:0;border-left:14px solid rgba(255,255,255,0.92);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px"></span>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;pointer-events:none;padding:16px;display:flex;flex-direction:column;gap:5px">
    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--accent, #FF5A2D)">PROMPT</span>
    <span style="font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.88)">“{{ prompt }}”</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 360, &quot;height&quot;: 430},
  &quot;slotId&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;tile-1&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;prompt&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Launch film for a project-management app&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;meta&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;0:22 · 16:9&quot;, &quot;tsType&quot;: &quot;string&quot;}
}"></script>
</body>
</html>
